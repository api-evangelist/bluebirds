name: Bluebirds
description: >-
  Bluebirds is an AI-powered outbound sales and go-to-market (GTM) prospecting
  platform, founded in 2022 by Rohan Punamia (CEO) and Kunal Punera (CTO). The
  product helps sales teams create, test, and scale AI-driven prospecting
  triggers, letting representatives target and personalize outreach in a unified
  workflow so they reach the right personas with the right message at the right
  time. Bluebirds was seed-funded by Lightspeed Venture Partners (invested 2023).
  As of July 2026 the primary domain bluebirds.com 301-redirects to Salesforce's
  AI prospecting agent page, indicating the Bluebirds team and technology have
  been absorbed into Salesforce. Bluebirds exposes no public developer or API
  surface — no docs, developer, api, status, or trust subdomains resolve, and the
  application host (app.bluebirds.com) is login-gated behind bot protection — so
  this profile is identity-only and carries no API artifacts.
