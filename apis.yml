name: Bluebirds
description: >-
  Bluebirds was an AI-powered outbound sales and go-to-market (GTM) prospecting
  platform, founded in 2022 by Rohan Punamia (CEO) and Kunal Punera (CTO). The
  product helped sales teams create, test, and scale AI-driven prospecting
  triggers, combining LinkedIn signals with first-party CRM data and
  de-anonymized web traffic so representatives could target and personalize
  outreach in a unified workflow. Bluebirds was seed-funded by Lightspeed
  Venture Partners (invested 2023). Salesforce announced a definitive agreement
  to acquire Bluebirds in August 2025 and folded the prospecting agent into
  Sales Cloud and Agentforce, with integration expected complete by the end of
  Salesforce fiscal Q3 2026. The absorption is now complete: as of August 2026
  every path on bluebirds.com — including /pricing, /docs and every
  /.well-known/ path — answers HTTP 301 to Salesforce's AI prospecting agent
  page from an AWS redirect service, api./docs./developer./status./trust
  subdomains do not resolve, and the former application host app.bluebirds.com
  resolves but resets the TLS handshake. Bluebirds therefore exposes no public
  developer or API surface of its own; the prospecting capability is now reached
  through Salesforce, and this profile is identity-only.
